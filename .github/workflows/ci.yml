name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: quant
          POSTGRES_DB: quant_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quant -d quant_platform_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      QUANT_TEST_PG_DSN: postgresql://quant:quant@localhost:5432/quant_platform_test
      QUANT_TEST_REDIS_URL: redis://localhost:6379/15
      # Infra indisponível vira falha (não skip): os testes de integração são
      # evidência dos critérios de aceite e não podem "passar" sem rodar.
      QUANT_REQUIRE_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true

      # Python vem do .python-version; --locked falha se uv.lock estiver
      # desatualizado em relação aos pyproject.toml (ADR-0011).
      - name: Install workspace (módulos implementados + grupo dev)
        run: uv sync --locked --all-packages

      # NOTE: os demais módulos ainda não têm pyproject.toml (aguardando
      # spec — ver README.md raiz). Ao implementar, adicionar a `members`
      # no pyproject.toml da raiz e aos caminhos de lint/mypy/bandit/pytest.

      - name: Lint (ruff)
        run: uv run --locked ruff check market-data-lake feature-store risk-engine trading-api backtesting-engine

      - name: Format (ruff)
        run: uv run --locked ruff format --check market-data-lake feature-store risk-engine trading-api backtesting-engine

      - name: Type-check (mypy)
        run: uv run --locked mypy market-data-lake/src feature-store/src risk-engine/src trading-api/src backtesting-engine/src

      - name: Security scan (bandit)
        run: uv run --locked bandit -r market-data-lake/src feature-store/src risk-engine/src trading-api/src backtesting-engine/src

      # Audita o lockfile (o que de fato roda), sem os módulos do workspace —
      # eles não existem no PyPI e não devem ser consultados lá.
      - name: Dependency audit (pip-audit)
        run: |
          uv export --locked --all-packages --no-emit-workspace --format requirements-txt -o requirements-audit.txt
          uv run --locked pip-audit -r requirements-audit.txt --disable-pip

      # O Postgres do runner nasce vazio: prova que o schema é reconstruível
      # só pelas migrações, e que o downgrade desfaz o upgrade (ADR-0012).
      - name: Migrations (upgrade → downgrade → upgrade em banco vazio)
        env:
          MARKET_DATA_LAKE_PG_DSN: ${{ env.QUANT_TEST_PG_DSN }}
          RISK_ENGINE_PG_DSN: ${{ env.QUANT_TEST_PG_DSN }}
        run: |
          for module in market-data-lake risk-engine; do
            uv run --locked alembic -c "$module/alembic.ini" upgrade head
            uv run --locked alembic -c "$module/alembic.ini" downgrade base
            uv run --locked alembic -c "$module/alembic.ini" upgrade head
          done

      - name: Tests (contra Postgres/Redis/DuckDB reais; trading-api não precisa de infra)
        run: uv run --locked pytest market-data-lake feature-store risk-engine trading-api backtesting-engine --cov

  import-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install workspace
        run: uv sync --locked --all-packages
      # Garante que as fronteiras do ADR-0001 (monólito modular) não sejam
      # furadas por imports cruzados entre módulos ou entre camadas
      # internas (config em .importlinter, na raiz).
      - name: Check module boundaries
        run: uv run --locked lint-imports
