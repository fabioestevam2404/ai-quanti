name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: quant
          POSTGRES_DB: quant_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quant -d quant_platform_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      QUANT_TEST_PG_DSN: postgresql://quant:quant@localhost:5432/quant_platform_test
      QUANT_TEST_REDIS_URL: redis://localhost:6379/15
      # Infra indisponível vira falha (não skip): os testes de integração são
      # evidência dos critérios de aceite e não podem "passar" sem rodar.
      QUANT_REQUIRE_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tooling
        run: |
          pip install --upgrade pip setuptools
          pip install ruff mypy bandit pip-audit

      - name: "Install módulos implementados (Fase 1-2 e fatia inicial da Fase 4)"
        run: |
          pip install -e "./market-data-lake[dev]"
          pip install -e "./feature-store[dev]"
          pip install -e "./risk-engine[dev]"
          pip install -e "./trading-api[dev]"

      # NOTE: os demais módulos ainda não têm pyproject.toml (aguardando
      # spec — ver README.md raiz). Conforme forem implementados, adicionar
      # ao pip install acima e aos comandos de lint/mypy/bandit/pytest abaixo.

      - name: Lint (ruff)
        run: ruff check market-data-lake feature-store risk-engine trading-api

      - name: Type-check (mypy)
        run: mypy market-data-lake/src feature-store/src risk-engine/src trading-api/src

      - name: Security scan (bandit)
        run: bandit -r market-data-lake/src feature-store/src risk-engine/src trading-api/src

      - name: Dependency audit (pip-audit)
        run: pip-audit

      - name: Tests (contra Postgres/Redis/DuckDB reais; trading-api não precisa de infra)
        run: pytest market-data-lake feature-store risk-engine trading-api --cov

  import-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install módulos e import-linter
        run: |
          pip install --upgrade pip
          pip install import-linter
          pip install -e ./market-data-lake
          pip install -e ./feature-store
          pip install -e ./risk-engine
          pip install -e ./trading-api
      # Garante que as fronteiras do ADR-0001 (monólito modular) não sejam
      # furadas por imports cruzados entre módulos ou entre camadas
      # internas (config em .importlinter, na raiz).
      - name: Check module boundaries
        run: lint-imports
