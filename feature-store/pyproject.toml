[project]
name = "feature-store"
version = "0.1.0"
description = "Feature store versionada para treino e inferência (hot-path)."
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
]

# market-data-lake não é publicado em índice — instale ambos como editable
# no mesmo venv: `pip install -e ./market-data-lake -e ./feature-store`
# (monólito modular, ADR-0001; sem publicação inter-módulo nesta fase).

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
