[project]
name = "feature-store"
version = "0.1.0"
description = "Feature store versionada para treino e inferência (hot-path)."
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
]

# Usa market_data_lake.api, que não é publicado em índice: o uv workspace
# da raiz instala os dois no mesmo ambiente (`uv sync --all-packages`,
# ADR-0011). Ferramentas de dev/teste: grupo `dev` da raiz.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
