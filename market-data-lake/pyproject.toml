[project]
name = "market-data-lake"
version = "0.1.0"
description = "Ingestão, versionamento e armazenamento histórico de dados de mercado."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0",
    "psycopg[binary]>=3.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
