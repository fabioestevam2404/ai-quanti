[project]
name = "market-data-lake"
version = "0.1.0"
description = "Ingestão, versionamento e armazenamento histórico de dados de mercado."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "duckdb>=1.0.0",
    "psycopg[binary]>=3.1",
    "requests>=2.31",
    # Certificados do sistema no download da B3 (rede com inspeção TLS).
    "truststore>=0.9",
]

# Ferramentas de dev/teste: grupo `dev` do workspace na raiz (ADR-0011).

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
