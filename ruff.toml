target-version = "py311"
line-length = 100

[format]
# Specs e READMEs têm blocos de código escritos para leitura (assinaturas
# alinhadas, exemplos) — o formatter só cuida de arquivos Python.
exclude = ["*.md"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[lint.per-file-ignores]
"tests/*" = ["S101"]

[lint.isort]
known-first-party = ["market_data_lake", "feature_store"]
