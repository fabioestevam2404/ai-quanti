[project]
name = "trading-api"
version = "0.1.0"
description = "Única porta de saída para a corretora/exchange."
requires-python = ">=3.11"
dependencies = []

# Ferramentas de dev/teste: grupo `dev` do workspace na raiz (ADR-0011).

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
